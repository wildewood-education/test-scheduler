<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#EDF1F5;
    --card:#FCFBF8;
    --navy:#1B2A4A;
    --navy-soft:#3D4F72;
    --graphite:#5B594F;
    --red:#C0392B;
    --highlighter:#E9B700;
    --line:#D7DDE6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    background:var(--card);
    color:var(--navy);
    font-family:'Nunito', sans-serif;
    min-height:100vh;
    display:flex;
  }
  .page{
    width:100%;
    min-height:100vh;
    background:var(--card);
    display:flex;
    flex-direction:column;
  }
  /* ── progress bar ── */
  .prog-bar{
    height:4px;
    background:transparent;
    flex-shrink:0;
  }
  .prog-fill{
    height:100%;
    background:var(--red);
    transition:width .3s ease;
  }
  /* ── main content area ── */
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:64px 14% 48px;
  }
  @media(max-width:600px){
    .screen{ padding:40px 24px 32px; }
  }
  /* ── header (logo) ── */
  .site-header{
    padding:20px 14% 16px;
  }
  @media(max-width:600px){
    .site-header{ padding:16px 24px 12px; }
  }
  .kicker{
    font-family:'Nunito', sans-serif;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--red);
    font-weight:600;
    margin-bottom:20px;
  }
  .question{
    font-family:'Newsreader', serif;
    font-size:34px;
    font-weight:600;
    line-height:1.2;
    letter-spacing:-.02em;
    margin-bottom:12px;
    flex-shrink:0;
  }
  .question-sub{
    font-size:15px;
    color:var(--graphite);
    margin-bottom:36px;
    line-height:1.6;
  }
  /* ── options ── */
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:16px;
    padding:18px 20px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:#fff;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    text-align:left;
    width:100%;
    font-family:'Nunito', sans-serif;
    font-size:15px;
    color:var(--navy);
    line-height:1.5;
  }
  .opt:hover{ border-color:var(--navy-soft); }
  .opt.selected{
    border-color:var(--navy);
    background:#F0F3F8;
  }
  .opt-marker{
    flex-shrink:0;
    width:24px;
    height:24px;
    border-radius:50%;
    border:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Nunito', sans-serif;
    font-size:11px;
    font-weight:600;
    color:var(--graphite);
    margin-top:1px;
    transition:background .15s, border-color .15s;
  }
  .opt-marker.square{ border-radius:6px; }
  .opt-notsure{
    margin-top:12px !important;
    border:2px dashed var(--line) !important;
    border-radius:24px !important;
    background:transparent !important;
    color:var(--graphite) !important;
    font-style:italic;
  }
  .opt-notsure.selected{
    border-color:var(--navy) !important;
    background:var(--navy) !important;
    color:#fff !important;
    font-style:italic;
  }
  .opt-notsure .opt-marker{
    width:16px; height:16px;
    border-radius:50%;
    border-color:currentColor;
    flex-shrink:0;
  }
  .opt-notsure.selected .opt-marker{
    background:#fff;
    border-color:#fff;
  }
  .opt.selected .opt-marker{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }
  /* ── text input ── */
  .text-input{
    font-family:'Nunito', sans-serif;
    font-size:22px;
    color:var(--navy);
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    padding:12px 0;
    width:100%;
    outline:none;
    transition:border-color .15s;
  }
  .text-input:focus{ border-color:var(--navy); }
  .text-input::placeholder{ color:var(--line); }
  /* ── date input ── */
  .date-input{
    font-family:'Nunito', sans-serif;
    font-size:18px;
    color:var(--navy);
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    padding:14px 18px;
    outline:none;
    transition:border-color .15s;
  }
  .date-input:focus{ border-color:var(--navy); }
  /* ── multi-select note ── */
  .day-circles-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:8px;
  }
  .day-circle{
    width:64px;
    height:64px;
    border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    font-family:'Nunito', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--navy);
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .day-circle.selected{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }
  .day-circle:active{ transform:scale(.95); }
  .multi-note{
    font-family:'Nunito', sans-serif;
    font-size:12px;
    color:var(--graphite);
    margin-bottom:20px;
  }
  /* ── nav ── */
  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:40px;
    flex-shrink:0;
  }
  .btn{
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:15px;
    border-radius:10px;
    padding:13px 28px;
    border:none;
    cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.3; cursor:not-allowed; }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:hover:not(:disabled){ background:var(--navy-soft); }
  .btn-ghost{ background:transparent; color:var(--graphite); padding:13px 8px; }
  .btn-ghost:hover{ color:var(--navy); }
  /* ── intro ── */
  .intro-eyebrow{
    font-family:'Nunito', sans-serif;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--red);
    font-weight:600;
    margin-bottom:24px;
  }
  .intro-title{
    font-family:'Newsreader', serif;
    font-size:48px;
    font-weight:700;
    line-height:1.1;
    letter-spacing:-.03em;
    margin-bottom:24px;
  }
  .intro-body{
    font-size:17px;
    color:var(--graphite);
    line-height:1.7;
    margin-bottom:48px;
  }
  /* ── results ── */
  .result-eyebrow{
    font-family:'Nunito', sans-serif;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--red);
    font-weight:600;
    margin-bottom:16px;
  }
  .result-title{
    font-family:'Newsreader', serif;
    font-size:36px;
    font-weight:700;
    letter-spacing:-.02em;
    margin-bottom:8px;
  }
  .result-sub{
    font-size:15px;
    color:var(--graphite);
    margin-bottom:40px;
    line-height:1.6;
  }
  .sessions-list{
    display:flex;
    flex-direction:column;
    gap:0;
    position:relative;
  }
  .sessions-list::before{
    content:'';
    position:absolute;
    left:19px;
    top:0; bottom:0;
    width:2px;
    background:var(--line);
    z-index:0;
  }
  .session-row{
    display:flex;
    gap:20px;
    padding-bottom:0;
    position:relative;
    z-index:1;
  }
  .session-row:last-child{ padding-bottom:0; }
  .session-num{
    flex-shrink:0;
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--navy);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:14px;
  }
  .session-body{ flex:1; padding-top:6px; padding-bottom:0; }
  .session-week{
    font-family:'Nunito', sans-serif;
    font-size:12px;
    color:var(--red);
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .session-type{
    font-family:'Newsreader', serif;
    font-size:20px;
    font-weight:600;
    margin-bottom:6px;
  }
  .session-goals{
    font-size:14px;
    color:var(--graphite);
    line-height:1.6;
  }
  .session-summary{
    font-size:14px;
    color:var(--graphite);
    line-height:1.6;
    margin-bottom:6px;
  }
  .focus-areas{
    font-family:'Nunito', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--navy);
    background:#F0F3F8;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:10px 16px;
    margin-bottom:32px;
    display:inline-block;
  }
  .focus-areas span{
    color:var(--navy-soft);
    font-weight:400;
  }
  @media print {
    body{ background:#fff; }
    .page{ border:none; box-shadow:none; }
    .prog-bar{ display:none; }
    .satisfy{ display:none; }
    #downloadPdfBtn{ display:none; }
    .nav{ display:none; }
    .screen{ padding:24px 40px; }
  }
  /* ── start marker ── */
  .start-marker{
    display:flex;
    gap:20px;
    padding-bottom:0;
    position:relative;
    z-index:1;
  }
  .start-dot{
    flex-shrink:0;
    width:40px;
    height:40px;
    border-radius:50%;
    border:2.5px solid var(--highlighter);
    background:#FFFBEA;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }
  .start-body{ flex:1; padding-top:6px; padding-bottom:8px; }
  .start-date{
    font-family:'Nunito', sans-serif;
    font-size:12px;
    color:var(--highlighter);
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:4px;
    filter:brightness(.8);
  }
  .start-label{
    font-size:14px;
    color:var(--graphite);
    line-height:1.6;
  }
  /* ── in-between notes ── */
  .inbetween{
    display:flex;
    align-items:stretch;
    gap:0;
    position:relative;
    z-index:1;
    margin:0;
    padding:0;
  }
  .inbetween-spine{
    flex-shrink:0;
    width:40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .inbetween-spine-line{
    width:2px;
    height:16px;
    flex:none;
    background:var(--line);
  }
  .inbetween-dot{
    flex-shrink:0;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--highlighter);
    border:2px solid #fff;
    box-shadow:0 0 0 2px var(--highlighter);
    margin:6px 0;
  }
  .inbetween-card{
    flex:1;
    margin:8px 0 8px 20px;
    background:#FFFBEA;
    border:1.5px solid var(--highlighter);
    border-radius:10px;
    padding:10px 14px;
    font-size:13px;
    color:var(--navy);
    line-height:1.6;
  }
  .inbetween-card-label{
    font-family:'Nunito', sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--highlighter);
    filter:brightness(.8);
    margin-bottom:4px;
  }
  /* ── pt-marker — red box like inbetween ── */
  .pt-marker{
    display:flex;
    align-items:stretch;
    gap:0;
    position:relative;
    z-index:1;
    margin:0;
    padding:0;
  }
  .pt-spine{
    flex-shrink:0;
    width:40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .pt-spine-line{
    width:2px;
    flex:1;
    background:var(--line);
  }
  .pt-spine-dot{
    flex-shrink:0;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--red);
    border:2px solid #fff;
    box-shadow:0 0 0 2px var(--red);
    margin:6px 0;
  }
  .pt-card{
    flex:1;
    margin:8px 0 8px 20px;
    background:#FEF2F2;
    border:1.5px solid var(--red);
    border-radius:10px;
    padding:10px 14px;
  }
  .pt-week{
    font-family:'Nunito', sans-serif;
    font-size:10px;
    color:var(--red);
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .pt-label{
    font-size:14px;
    font-weight:600;
    color:var(--navy);
    line-height:1.4;
  }
  .pt-sub{
    font-size:12px;
    color:var(--graphite);
    margin-top:3px;
  }
  .test-date-marker{
    display:flex;
    gap:20px;
    padding-top:0;
    position:relative;
    z-index:1;
  }
  .test-date-dot{
    flex-shrink:0;
    width:40px;
    height:40px;
    border-radius:50%;
    border:2.5px solid var(--red);
    background:#FEF2F2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }
  .test-date-body{ flex:1; padding-top:6px; }
  .test-date-label{
    font-family:'Nunito', sans-serif;
    font-size:11px;
    color:var(--red);
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .test-date-name{
    font-family:'Newsreader', serif;
    font-size:18px;
    font-weight:600;
    color:var(--navy);
  }
  .footer{
    padding:20px 32px;
    border-top:1px solid var(--line);
    font-family:'Nunito', sans-serif;
    font-size:11px;
    color:var(--graphite);
    text-align:center;
    letter-spacing:.04em;
    flex-shrink:0;
  }
  .satisfy{
    margin-top:40px;
    padding-top:32px;
    border-top:1px solid var(--line);
  }
  .satisfy-q{
    font-family:'Newsreader', serif;
    font-size:22px;
    font-weight:600;
    margin-bottom:20px;
  }
  .satisfy-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
  }
  .download-note{
    font-family:'Nunito', sans-serif;
    font-size:12px;
    color:var(--graphite);
    margin-top:16px;
  }
  .download-note a{ color:var(--navy-soft); }
  .sent-screen{ max-width:520px; }
</style>
</head>

// Which session types are available given current sessions already picked
function availableTypes(){
  const sessions = state.answers.sessions;
  const currentStep = state.sessionStep;
  const hasPT = state.answers.practicetestplan === 'yes';

  const priorSessions = sessions.slice(0, currentStep);

  const prepPTUsed = sessions.some(s => s && s.type === 'beforept');
  const lastType = priorSessions.length > 0 ? priorSessions[priorSessions.length - 1].type : null;

  const ORDER = ['intro','checkin','beforept','afterpt','testday'];
  const lastIdx = lastType ? ORDER.indexOf(lastType) : -1;
  const minIdx = Math.max(0, lastIdx);

  return ORDER.filter((t, idx) => {
    if (idx < minIdx) return false;
    if ((t === 'beforept' || t === 'afterpt') && !hasPT) return false;
    return true;
  });
}

// ─────────────────────────────────────────────
// CALENDAR HELPERS
// ─────────────────────────────────────────────
function parseDate(str){
  if (!str) return null;
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function mondayOf(d){ const day = d.getDay(); const diff = day===0?-6:1-day; return addDays(d,diff); }
function weekLabel(d){ return 'Week of ' + mondayOf(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function weeksBetween(a,b){ return Math.max(1, Math.round((b-a)/(7*24*3600*1000))); }

function buildTimeline(){
  const start = parseDate(state.answers.startdate);
  const test  = parseDate(state.answers.testdate);
  if (!start || !test) return { sessionWeeks:[], ptWeek:null };

  const sessions = state.answers.sessions;
  const N = sessions.length;
  if (N === 0) return { sessionWeeks:[], ptWeek:null };

  const hasPT = state.answers.practicetestplan === 'yes';
  const totalWeeks = weeksBetween(start, test);

  // If start date is Friday (5) or Saturday (6), no session can happen until
  // the following week. minWeek is the earliest valid session week (0-indexed).
  const dow = start.getDay();
  const minWeek = (dow === 5 || dow === 6) ? 1 : 0;

  // Count sessions by type
  const typeCounts = {};
  sessions.forEach(s => { typeCounts[s.type] = (typeCounts[s.type]||0)+1; });

  const numTestday  = typeCounts.testday  || 0;
  const numAfterpt  = typeCounts.afterpt  || 0;
  const numBeforept = typeCounts.beforept || 0;
  const numIntro    = typeCounts.intro    || 0;

  // ── Anchor weeks, computed backwards from test date ───────────────────────
  //
  // testday  → last N weeks before the test
  // afterpt  → sits just before testday; PT marker goes 1 week before first afterpt
  // beforept → student finishes binder before PT, so beforept ends 1 week before PT
  // checkin  → fills the study zone between intro (or minWeek) and beforept
  // intro    → minWeek (week 0 normally; week 1 if start is Fri or Sat)
  //
  // All values are clamped to [minWeek, totalWeeks] — nothing before the start
  // date, nothing after the test date.

  function clamp(v){ return Math.min(Math.max(v, minWeek), totalWeeks); }

  const testdayEnd   = totalWeeks - 1;
  const testdayStart = clamp(testdayEnd - (numTestday - 1));

  const afterptEnd   = clamp(testdayStart - 1);
  const afterptStart = clamp(afterptEnd - Math.max(0, numAfterpt - 1));

  // PT goes 1 week before first afterpt (or 1 week before testday if no afterpt)
  const ptAnchorIdx = sessions.findIndex(s => s.type === 'afterpt');
  const ptRefWeek   = numAfterpt > 0 ? afterptStart
                    : numTestday > 0  ? testdayStart
                    :                   totalWeeks - 1;
  const ptWeekNum   = clamp(ptRefWeek - 1);

  // beforept: student should finish all binder lessons before taking the PT
  const beforeptEnd   = clamp(ptWeekNum - 1);
  const beforeptStart = clamp(beforeptEnd - Math.max(0, numBeforept - 1));

  // checkin: fills the study zone between intro (or minWeek) and the next phase
  const checkinCeiling = numBeforept > 0 ? beforeptStart - 1
                       : numAfterpt  > 0 ? afterptStart  - 1
                       :                   testdayStart  - 1;
  const checkinEnd   = clamp(checkinCeiling);
  const checkinStart = clamp(numIntro > 0 ? 1 : minWeek);

  // ── Assign a week number to each session ──────────────────────────────────
  const typeIdx = {};  // how many of each type placed so far (0-based)
  const sessionWeekNums = sessions.map((sess) => {
    const t = sess.type;
    const idx = typeIdx[t] === undefined ? (typeIdx[t] = 0) : ++typeIdx[t];

    if (t === 'intro') return minWeek;

    if (t === 'checkin'){
      const span  = Math.max(0, checkinEnd - checkinStart);
      const count = typeCounts.checkin || 1;
      if (count === 1) return clamp(Math.round(checkinStart + span / 2));
      return clamp(checkinStart + Math.round((idx / (count - 1)) * span));
    }

    if (t === 'beforept'){
      const span  = Math.max(0, beforeptEnd - beforeptStart);
      const count = typeCounts.beforept || 1;
      if (count === 1) return beforeptEnd;
      return clamp(beforeptStart + Math.round((idx / (count - 1)) * span));
    }

    if (t === 'afterpt'){
      const span  = Math.max(0, afterptEnd - afterptStart);
      const count = typeCounts.afterpt || 1;
      if (count === 1) return afterptStart;
      return clamp(afterptStart + Math.round((idx / (count - 1)) * span));
    }

    if (t === 'testday'){
      const span  = Math.max(0, testdayEnd - testdayStart);
      const count = typeCounts.testday || 1;
      if (count === 1) return testdayEnd;
      return clamp(testdayStart + Math.round((idx / (count - 1)) * span));
    }

    return minWeek;
  });

  // Ensure non-decreasing order (sessions can't go backwards in time)
  for (let i = 1; i < sessionWeekNums.length; i++){
    if (sessionWeekNums[i] <= sessionWeekNums[i - 1]){
      sessionWeekNums[i] = sessionWeekNums[i - 1] + 1;
    }
    sessionWeekNums[i] = Math.min(sessionWeekNums[i], totalWeeks);
  }

  const sessionWeeks = sessionWeekNums.map(wn => weekLabel(addDays(start, wn * 7)));

  // PT week label (only shown if student said yes to practice test)
  let ptWeek = null;
  if (hasPT){
    ptWeek = weekLabel(addDays(start, ptWeekNum * 7));
  }

  return { sessionWeeks, ptWeek, ptAnchorIdx };
}

// ─────────────────────────────────────────────
// PROGRESS
// ─────────────────────────────────────────────
function computeProgress(){
  const N = parseInt(state.answers.sessioncount) || 3;
  const fixedTotal = getFixedQuestions().length;
  const sessionTotal = N * 2;
  const total = fixedTotal + sessionTotal;

  if (state.phase === 'intro') return 0;
  if (state.phase === 'fixed') return Math.round((state.fixedStep / total) * 100);
  if (state.phase === 'session'){
    const done = fixedTotal + (state.sessionStep * 2) + state.sessionSubStep;
    return Math.round((done / total) * 100);
  }
  return 100;
}

// ─────────────────────────────────────────────
// PUSH / POP HISTORY
// ─────────────────────────────────────────────
function pushHistory(){
  state.history.push({
    phase: state.phase,
    fixedStep: state.fixedStep,
    sessionStep: state.sessionStep,
    sessionSubStep: state.sessionSubStep,
    answers: JSON.parse(JSON.stringify(state.answers)),
  });
  if (state.future && state.future.length > 0){
    const next = state.future[state.future.length - 1];
    const sameStep = next.phase === state.phase &&
      next.fixedStep === state.fixedStep &&
      next.sessionStep === state.sessionStep &&
      next.sessionSubStep === state.sessionSubStep;
    if (!sameStep) state.future = [];
  }
}
function popHistory(){
  if (state.history.length === 0) return;
  if (!state.future) state.future = [];
  state.future.push({
    phase: state.phase,
    fixedStep: state.fixedStep,
    sessionStep: state.sessionStep,
    sessionSubStep: state.sessionSubStep,
    answers: JSON.parse(JSON.stringify(state.answers)),
  });
  const prev = state.history.pop();
  state.phase = prev.phase;
  state.fixedStep = prev.fixedStep;
  state.sessionStep = prev.sessionStep;
  state.sessionSubStep = prev.sessionSubStep;
  state.answers = prev.answers;
  render();
}
function popFuture(){
  if (!state.future || state.future.length === 0) return false;
  const next = state.future.pop();
  state.history.push({
    phase: state.phase,
    fixedStep: state.fixedStep,
    sessionStep: state.sessionStep,
    sessionSubStep: state.sessionSubStep,
    answers: JSON.parse(JSON.stringify(state.answers)),
  });
  state.phase = next.phase;
  state.fixedStep = next.fixedStep;
  state.sessionStep = next.sessionStep;
  state.sessionSubStep = next.sessionSubStep;
  state.answers = next.answers;
  render();
  return true;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render(){
  document.getElementById('progFill').style.width = computeProgress() + '%';
  const s = document.getElementById('screen');
  s.innerHTML = '';

  if (state.phase === 'intro')    return renderIntro(s);
  if (state.phase === 'fixed')    return renderFixed(s);
  if (state.phase === 'session')  return renderSession(s);
  if (state.phase === 'results')  return renderResults(s);
}

// ─────────────────────────────────────────────
// FIXED QUESTIONS
// ─────────────────────────────────────────────
function renderFixed(s){
  const qs = getFixedQuestions();
  const q = qs[state.fixedStep];
  const total = getFixedQuestions().length + (parseInt(state.answers.sessioncount)||3)*2;
  const num = state.fixedStep + 1;

  s.innerHTML = `<div class="kicker">Question ${num} of ${total}</div>`;

  const title = document.createElement('div');
  title.className = 'question';
  title.textContent = q.q;
  s.appendChild(title);

  if (q.optional){
    const badge = document.createElement('div');
    badge.className = 'question-sub';
    badge.style.cssText = 'font-style:italic;color:var(--graphite);margin-top:2px;';
    badge.textContent = 'Optional — skip if not applicable';
    s.appendChild(badge);
  }
  if (q.sub){
    const sub = document.createElement('div');
    sub.className = 'question-sub';
    sub.textContent = q.sub;
    s.appendChild(sub);
  }

  const opts = document.createElement('div');
  opts.className = 'options';
  s.appendChild(opts);

  let canNext = false;

  if (q.type === 'text'){
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'text-input';
    inp.placeholder = q.placeholder || '';
    inp.value = state.answers[q.id] || '';
    opts.appendChild(inp);
    canNext = !!inp.value.trim();
    inp.oninput = () => {
      state.answers[q.id] = inp.value;
      nextBtn.disabled = !inp.value.trim();
    };
    inp.onkeydown = (e) => { if(e.key==='Enter' && inp.value.trim()) advance(); };
    setTimeout(() => inp.focus(), 50);
  } else if (q.type === 'date'){
    const inp = document.createElement('input');
    inp.type = 'date';
    inp.className = 'date-input';
    inp.value = state.answers[q.id] || '';
    opts.appendChild(inp);
    canNext = !!inp.value;
    inp.onchange = () => {
      state.answers[q.id] = inp.value;
      nextBtn.disabled = !inp.value;
    };
  } else if (q.type === 'single'){
    q.options.forEach((o, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt' + (state.answers[q.id]===o.value?' selected':'');
      btn.innerHTML = `<span class="opt-marker">${String.fromCharCode(65+i)}</span><span>${o.label}</span>`;
      btn.onclick = () => {
        if (q.id === 'testtype' && state.answers.testtype !== o.value){
          state.answers.subjects = [];
        }
        state.answers[q.id] = o.value;
        render();
      };
      opts.appendChild(btn);
    });
    canNext = !!state.answers[q.id];
  } else if (q.type === 'multi'){
    const note = document.createElement('div');
    note.className = 'multi-note';
    note.textContent = 'Select all that apply';
    s.insertBefore(note, opts);
    const sel = state.answers[q.id] || [];
    if (sel.includes('notsure')) note.style.display = 'none';

    if (q.style === 'day-circles'){
      opts.innerHTML = '';
      const row = document.createElement('div');
      row.className = 'day-circles-row';
      q.options.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'day-circle' + (sel.includes(o.value) ? ' selected' : '');
        btn.textContent = o.label;
        btn.onclick = () => {
          const cur = state.answers[q.id] || [];
          state.answers[q.id] = cur.includes(o.value)
            ? cur.filter(x => x !== o.value)
            : [...cur, o.value];
          render();
        };
        row.appendChild(btn);
      });
      opts.appendChild(row);
      canNext = (state.answers[q.id]||[]).length > 0;
    } else {
    q.options.forEach((o, i) => {
      const btn = document.createElement('button');
      const isSelected = sel.includes(o.value);
      const isNotSureOpt = o.value === 'notsure';
      const markerClass = isNotSureOpt ? 'opt-marker' : 'opt-marker square';
      const markerInner = isSelected ? (isNotSureOpt ? '&#9679;' : '&#10003;') : '';
      btn.className = 'opt' + (isSelected?' selected':'') + (isNotSureOpt?' opt-notsure':'');
      btn.style.cssText = '';
      btn.innerHTML = '<span class="' + markerClass + '">' + markerInner + '</span><span>' + o.label + '</span>';
      btn.onclick = () => {
        const cur = state.answers[q.id] || [];
        if (o.value === 'notsure'){
          state.answers[q.id] = cur.includes('notsure') ? [] : ['notsure'];
        } else {
          const without = cur.filter(x => x !== 'notsure');
          state.answers[q.id] = without.includes(o.value)
            ? without.filter(x => x !== o.value)
            : [...without, o.value];
        }
        render();
      };
      opts.appendChild(btn);
    });
    }
    canNext = (state.answers[q.id]||[]).length > 0;
  } else if (q.type === 'textarea'){
    const ta = document.createElement('textarea');
    ta.className = 'text-input';
    ta.style.cssText = 'height:120px;resize:vertical;line-height:1.6;font-size:15px;max-width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;';
    ta.placeholder = q.placeholder || '';
    ta.value = state.answers[q.id] || '';
    opts.appendChild(ta);
    canNext = q.optional ? true : !!ta.value.trim();
    ta.oninput = () => {
      state.answers[q.id] = ta.value;
      if (!q.optional) nextBtn.disabled = !ta.value.trim();
    };
    setTimeout(() => ta.focus(), 50);
  }

  const nav = document.createElement('div');
  nav.className = 'nav';
  const backBtn = document.createElement('button');
  backBtn.className = 'btn btn-ghost';
  backBtn.textContent = '← Back';
  backBtn.onclick = () => popHistory();
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn btn-primary';
  nextBtn.textContent = 'Next →';
  nextBtn.disabled = !canNext;
  nextBtn.onclick = advance;
  nav.appendChild(backBtn);
  nav.appendChild(nextBtn);
  s.appendChild(nav);

  function advance(){
    if (state.future && state.future.length > 0){
      const next = state.future[state.future.length - 1];
      const currentAnswer = JSON.stringify(state.answers[q.id]);
      const futureAnswer = JSON.stringify(next.answers[q.id]);
      if (currentAnswer === futureAnswer){ popFuture(); return; }
      else { state.future = []; }
    }
    pushHistory();
    if (state.fixedStep < qs.length - 1){
      state.fixedStep++;
    } else {
      state.phase = 'session';
      state.sessionStep = 0;
      state.sessionSubStep = 0;
      state.answers.sessions = [];
    }
    render();
  }
}

// ─────────────────────────────────────────────
// SESSION QUESTIONS
// ─────────────────────────────────────────────
function renderSession(s){
  const N = parseInt(state.answers.sessioncount) || 3;
  const fixedTotal = getFixedQuestions().length;
  const total = fixedTotal + N * 2;
  const qNum = fixedTotal + (state.sessionStep * 2) + state.sessionSubStep + 1;
  const ordinals = ['first','second','third','fourth','fifth'];
  const ordinal = ordinals[state.sessionStep] || ('session ' + (state.sessionStep+1));

  s.innerHTML = '<div class="kicker">Question ' + qNum + ' of ' + total + '</div>';

  if (state.sessionSubStep === 0){
    const title = document.createElement('div');
    title.className = 'question';
    title.textContent = 'For your ' + ordinal + ' session, what type would you like?';
    s.appendChild(title);

    const opts = document.createElement('div');
    opts.className = 'options';
    s.appendChild(opts);

    const current = state.answers.sessions[state.sessionStep];
    const available = availableTypes();

    const nav = document.createElement('div');
    nav.className = 'nav';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn btn-ghost';
    backBtn.textContent = '\u2190 Back';
    backBtn.onclick = function(){ popHistory(); };
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-primary';
    nextBtn.textContent = 'Next \u2192';
    nextBtn.disabled = !current || !current.type;
    nextBtn.onclick = function(){
      if (state.future && state.future.length > 0){
        const next = state.future[state.future.length - 1];
        const cur = state.answers.sessions[state.sessionStep];
        const futSess = next.answers.sessions[state.sessionStep];
        if (cur && futSess && cur.type === futSess.type){ popFuture(); return; }
        else { state.future = []; }
      }
      pushHistory();
      state.sessionSubStep = 1;
      render();
    };

    available.forEach(function(t, i){
      const btn = document.createElement('button');
      const isSelected = current && current.type === t;
      btn.className = 'opt' + (isSelected ? ' selected' : '');
      btn.innerHTML = '<span class="opt-marker">' + String.fromCharCode(65+i) + '</span><span><strong>' + SESSION_TYPES[t].label + '</strong><br><span style="font-size:13px;color:var(--graphite)">' + SESSION_TYPES[t].desc + '</span></span>';
      btn.onclick = function(){
        if (!state.answers.sessions[state.sessionStep]){
          state.answers.sessions[state.sessionStep] = { type: t, goals: [] };
        } else {
          state.answers.sessions[state.sessionStep].type = t;
          state.answers.sessions[state.sessionStep].goals = [];
        }
        if (t === 'testday'){
          for (var j = state.sessionStep + 1; j < N; j++){
            state.answers.sessions[j] = { type: 'testday', goals: [] };
          }
        }
        opts.querySelectorAll('.opt').forEach(function(o){ o.classList.remove('selected'); });
        btn.classList.add('selected');
        nextBtn.disabled = false;
      };
      opts.appendChild(btn);
    });

    nav.appendChild(backBtn);
    nav.appendChild(nextBtn);
    s.appendChild(nav);

  } else {
    const session = state.answers.sessions[state.sessionStep];
    if (!session){ state.sessionSubStep = 0; render(); return; }
    const typeKey = session.type;
    const hasPTAnswer = state.answers.practicetestplan === 'yes';
    const goals = (GOALS[typeKey] || []).filter(function(g){
      if (!hasPTAnswer && g === 'Make TFT (Topic, Fact, Tool) cards of problems you got wrong on the practice test') return false;
      if (!hasPTAnswer && g === 'Review practice test') return false;
      return true;
    });
    const isReviewPT = typeKey === 'afterpt';
    const isPrepPT = typeKey === 'beforept';

    const title = document.createElement('div');
    title.className = 'question';
    if (isReviewPT){
      title.textContent = 'Aside from reviewing your practice test results, what else would you like to accomplish in your ' + ordinal + ' session?';
    } else if (isPrepPT){
      title.textContent = 'To best prepare for the practice test, what are your goals for your ' + ordinal + ' session?';
    } else {
      title.textContent = 'What would you like to accomplish in your ' + ordinal + ' session?';
    }
    s.appendChild(title);

    const note = document.createElement('div');
    note.className = 'multi-note';
    note.textContent = 'Select all that apply';
    s.appendChild(note);

    const opts = document.createElement('div');
    opts.className = 'options';
    s.appendChild(opts);

    goals.forEach(function(g, i){
      const sel = session.goals || [];
      const isSelected = sel.includes(g);
      const btn = document.createElement('button');
      btn.className = 'opt' + (isSelected ? ' selected' : '');
      btn.innerHTML = '<span class="opt-marker square">' + (isSelected ? '\u2713' : '') + '</span><span>' + g + '</span>';
      btn.onclick = function(){
        const cur = session.goals || [];
        const withoutNS = cur.filter(function(x){ return x !== '__notsure__'; });
        session.goals = withoutNS.includes(g) ? withoutNS.filter(function(x){ return x !== g; }) : withoutNS.concat([g]);
        render();
      };
      opts.appendChild(btn);
    });

    const otherValue = (session.goals || []).find(function(g){ return g.startsWith('Other: '); }) || '';
    const otherText = otherValue ? otherValue.replace('Other: ', '') : '';
    const isOtherSelected = !!otherValue;
    const otherBtn = document.createElement('div');
    otherBtn.className = 'opt' + (isOtherSelected ? ' selected' : '');
    otherBtn.style.flexDirection = 'column';
    otherBtn.style.alignItems = 'flex-start';
    otherBtn.style.gap = '10px';
    otherBtn.innerHTML = '<div style="display:flex;align-items:center;gap:16px;width:100%;"><span class="opt-marker square">' + (isOtherSelected ? '\u2713' : '') + '</span><span>Other</span></div><input type="text" id="otherInput" placeholder="Describe the goal..." value="' + otherText + '" style="width:100%;border:none;border-bottom:1.5px solid var(--line);background:transparent;font-family:Nunito,sans-serif;font-size:14px;color:var(--navy);padding:4px 0;outline:none;' + (isOtherSelected || otherText ? '' : 'display:none;') + '">';
    otherBtn.addEventListener('click', function(e){
      if (e.target.id === 'otherInput') return;
      const cur = session.goals || [];
      const existing = cur.find(function(g){ return g.startsWith('Other: '); });
      if (existing){
        session.goals = cur.filter(function(g){ return !g.startsWith('Other: '); });
      } else {
        session.goals = cur.filter(function(g){ return g !== '__notsure__'; }).concat(['Other: ']);
      }
      render();
    });
    opts.appendChild(otherBtn);

    const isNotSure = (session.goals || []).includes('__notsure__');
    if (isNotSure) note.style.display = 'none';
    const notSureBtn = document.createElement('button');
    notSureBtn.className = 'opt opt-notsure' + (isNotSure ? ' selected' : '');
    notSureBtn.style.cssText = '';
    notSureBtn.innerHTML = '<span class="opt-marker">' + (isNotSure ? '&#9679;' : '') + '</span><span>I\u2019m not sure yet</span>';
    notSureBtn.onclick = function(){
      session.goals = isNotSure ? [] : ['__notsure__'];
      render();
    };
    opts.appendChild(notSureBtn);

    if (isNotSure){
      opts.querySelectorAll('.opt').forEach(function(b){
        if (b !== notSureBtn){ b.style.opacity = '0.35'; b.style.pointerEvents = 'none'; }
      });
    }

    setTimeout(function(){
      const inp = document.getElementById('otherInput');
      if (!inp) return;
      inp.style.display = 'block';
      inp.onclick = function(e){ e.stopPropagation(); };
      inp.oninput = function(){
        const cur = session.goals || [];
        const val = inp.value.trim();
        session.goals = cur.filter(function(g){ return !g.startsWith('Other: '); });
        if (val) session.goals.push('Other: ' + val);
        const nb = document.querySelector('.nav .btn-primary');
        if (nb) nb.disabled = session.goals.length === 0;
      };
    }, 0);

    const nav = document.createElement('div');
    nav.className = 'nav';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn btn-ghost';
    backBtn.textContent = '\u2190 Back';
    backBtn.onclick = function(){ popHistory(); };
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-primary';
    const isLast = state.sessionStep >= N - 1;
    nextBtn.textContent = isLast ? 'See my plan \u2192' : 'Next \u2192';
    nextBtn.disabled = (session.goals || []).length === 0;
    nextBtn.onclick = function(){
      if (state.future && state.future.length > 0){
        const next = state.future[state.future.length - 1];
        const curGoals = JSON.stringify((session.goals||[]).slice().sort());
        const futGoals = JSON.stringify(((next.answers.sessions[state.sessionStep]||{}).goals||[]).slice().sort());
        if (curGoals === futGoals){ popFuture(); return; }
        else { state.future = []; }
      }
      pushHistory();
      if (isLast){
        state.phase = 'results';
      } else {
        const nextSession = state.answers.sessions[state.sessionStep + 1];
        state.sessionStep++;
        if (nextSession && nextSession.type === 'testday'){
          state.sessionSubStep = 1;
        } else {
          state.sessionSubStep = 0;
        }
      }
      render();
    };
    nav.appendChild(backBtn);
    nav.appendChild(nextBtn);
    s.appendChild(nav);
  }
}

// SESSION SUMMARY + SUBJECT RECOMMENDATION
// ─────────────────────────────────────────────
const SUBJECT_LABELS = { math:'Math', ela:'ELA', reading:'Reading', science:'Science', english:'English', writing:'Writing', notsure:'Not sure yet' };

function buildSubjectAssignments(sessions, subjects){
  if (!subjects || subjects.length === 0) return {};
  const relevant = sessions.map((sess, i) => i).filter(i => {
    const t = sessions[i].type;
    return t === 'checkin' || t === 'afterpt' || t === 'testday' || t === 'beforept';
  });
  const assignments = {};
  relevant.forEach((sessionIdx, count) => {
    const subject = subjects[count % subjects.length];
    assignments[sessionIdx] = SUBJECT_LABELS[subject] || subject;
  });
  return assignments;
}

function subjectRec(subjects){
  if (!subjects || subjects.length === 0) return null;
  return subjects.map(s => SUBJECT_LABELS[s] || s).join(' & ');
}

function sessSubjectLabel(sessions, subjects, idx){
  if (!subjects || subjects.length === 0) return null;
  const labels = subjects.map(s => SUBJECT_LABELS[s] || s);
  if (labels.length === 1) return labels[0];
  const relevant = sessions.map((_, j) => j).filter(j => {
    const t = sessions[j].type;
    return t === 'checkin' || t === 'afterpt' || t === 'testday' || t === 'beforept' || t === 'intro';
  });
  const pos = relevant.indexOf(idx);
  if (pos === -1) return null;
  if (relevant.length >= labels.length){
    return labels[pos % labels.length];
  } else {
    const base = labels[pos % labels.length];
    const next = pos === relevant.length - 1 ? labels.slice(pos + 1).join(' & ') : null;
    return next ? base + ' & ' + next : base;
  }
}

function sessionSummary(sess){
  const type = sess.type;
  const goals = sess.goals || [];
  const isReviewPT = type === 'afterpt';

  function toGerund(g){
    return g
      .replace(/^Make TFT/, 'Making TFT')
      .replace(/^Make /, 'Making ')
      .replace(/^Do challenge problems/, 'Doing challenge problems')
      .replace(/^Do the first lesson/, 'Doing the first lesson')
      .replace(/^Do selected lessons/, 'Doing selected lessons')
      .replace(/^Do /, 'Doing ')
      .replace(/^Learn a new topic/, 'Learning a new topic')
      .replace(/^Learn test strategies/, 'Learning test strategies')
      .replace(/^Learn /, 'Learning ')
      .replace(/^Create a review plan/, 'Creating a review plan')
      .replace(/^Create /, 'Creating ')
      .replace(/^Review practice test/, 'Reviewing the practice test')
      .replace(/^Review /, 'Reviewing ')
      .replace(/^Homework review/, 'Homework review')
      .replace(/^Content review/, 'Content review')
      .replace(/^Walkthrough /, 'Walking through ');
  }

  function formatGoal(g, idx, tftSeen){
    let text = g.replace(/^Other: /i, '');
    text = toGerund(text);
    if (!tftSeen[0] && text.includes('TFT cards')){
      tftSeen[0] = true;
    }
    return text;
  }

  if (goals.includes('__notsure__')){
    return 'Since you have not indicated what you would like to work on, let us know what the focus of this session will be before the session.';
  }

  const rawGoals = isReviewPT
    ? ['Reviewing practice test results', ...goals]
    : goals;

  const tftSeen = [false];
  const allGoals = rawGoals.map((g, i) => formatGoal(g, i, tftSeen));

  if (allGoals.length === 0) return SESSION_TYPES[type]?.desc || '';

  let sentence = '';
  if (allGoals.length === 1){
    sentence = 'This session focuses on ' + allGoals[0] + '.';
  } else if (allGoals.length === 2){
    sentence = 'This session covers ' + allGoals[0] + ' and ' + allGoals[1] + '.';
  } else {
    const last = allGoals[allGoals.length - 1];
    const rest = allGoals.slice(0, -1).join(', ');
    sentence = 'This session covers ' + rest + ', and ' + last + '.';
  }

  if (type === 'intro') sentence += ' A good starting point before independent study begins.';
  if (type === 'checkin') sentence += ' This is a check-in during the self-study phase.';
  if (type === 'beforept') sentence += ' This session gets you ready to sit the practice test independently.';
  if (type === 'afterpt') sentence += ' Your practice test results are the anchor — everything else builds on them.';
  if (type === 'testday') sentence += ' This session focuses on building confidence and readiness before test day.';
  return sentence;
}

function renderResults(s){

  function sectionHeader(title){

  }
  function infoGrid(rows){
    return '<table style="width:100%;border-collapse:collapse;font-size:13px;color:#1B2A4A;">' +
      rows.filter(function(r){ return r[1]; }).map(function(r){
        return '<tr style="border-bottom:1px solid rgba(27,42,74,0.08);">' +
          '<td style="padding:7px 16px 7px 0;font-weight:600;white-space:nowrap;width:38%;vertical-align:top;color:#1B2A4A;">' + r[0] + '</td>' +
          '<td style="padding:7px 0;color:#2c3e50;vertical-align:top;">' + r[1] + '</td>' +
        '</tr>';
      }).join('') +
    '</table>';
  }

  infoBlock.style.cssText = 'background:transparent;border:none;padding:0;margin-bottom:24px;font-size:13px;color:var(--navy);line-height:1.8;';
  infoBlock.innerHTML =
    sectionHeader('Student Details') +
    infoGrid([
      ['Name', name],
      ['Test', a.testtype ? a.testtype.toUpperCase() : ''],
      ['Test date', a.testdate ? formatStartDate(a.testdate) : ''],
      ['Start date', a.startdate ? formatStartDate(a.startdate) : ''],
      ['Sessions', a.sessioncount],
      ['Subjects', (a.subjects||[]).map(function(sub){ return SUBJECT_LABELS[sub]||sub; }).join(', ')],
      ['Prior study', PRIOR_LABELS[a.priorstudy] || a.priorstudy],
      ['Practice test', a.practicetestplan === 'yes' ? 'Yes' : a.practicetestplan === 'no' ? 'No' : ''],
    ]) +
    sectionHeader('Scheduling & Availability') +
    infoGrid([
      ['Session consistency', CONSISTENCY_LABELS[a.sessionconsistency] || a.sessionconsistency],
      ['Schedule visibility', AHEAD_LABELS[a.scheduleahead] || a.scheduleahead],
      ['Available days', availDays],
      ['Preferred times', timeWins],
      ['Never available', a.unavailable || ''],
      ['Schedule confirmed through', LIMIT_LABELS[a.schedulelimit] || a.schedulelimit],
      ['Meeting frequency', FREQ_LABELS[a.meetingfrequency] || a.meetingfrequency],

  s.appendChild(infoBlock);

  const list = document.createElement('div');

  list.id = 'planList';

      : curType === 'beforept' ? 'beforept'
      : curType === 'afterpt' ? 'afterpt'

      : (prevType === 'intro' || prevType === 'checkin') ? 'study'

        list.appendChild(inBetweenNote('Finish up your remaining binder lessons, review your TFT cards, and make sure your homework is complete before your Before Practice Test session.', 'Before practice test'));
      } else if (prevPhase === 'study' && phase === 'afterpt'){
        list.appendChild(inBetweenNote('Continue working through your binder lessons, do the homework, and make TFT cards of problems you got wrong.', 'In between sessions'));

  const sessionListEl = s.querySelector('[data-pdf="sessions"]');
  const infoBlockHTML = infoBlockEl ? infoBlockEl.outerHTML : '';
  const sessionListHTML = sessionListEl ? sessionListEl.outerHTML : '';
  const RENDER_WIDTH = s.offsetWidth || 700;

  const satisfy = document.createElement('div');
  satisfy.className = 'satisfy';
  satisfy.innerHTML = `
    <div class="satisfy-q">Are you satisfied with this plan?</div>
    <div class="satisfy-row">
      <button class="btn btn-primary" id="sendBtn">Yes, send to scheduler</button>
      <button class="btn btn-ghost" id="retakeBtn">Not quite — start over</button>
    </div>
    <div style="margin-top:16px;">
      <button class="btn btn-ghost" id="downloadPdfBtn" style="padding-left:0;">⬇ Save as PDF</button>
    </div>
  `;
  s.appendChild(satisfy);

  async function renderSection(html, bg){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;left:-9999px;top:0;width:' + RENDER_WIDTH + 'px;background:' + (bg||'#FCFBF8') + ';padding:32px 36px 48px;box-sizing:border-box;';
    wrap.innerHTML = html;
    document.body.appendChild(wrap);
    const h = wrap.getBoundingClientRect().height || wrap.scrollHeight;
    const canvas = await html2canvas(wrap, {
      scale: 2,
      useCORS: true,
      backgroundColor: bg || '#FCFBF8',
      windowWidth: RENDER_WIDTH,
      windowHeight: h,
      height: h,
    });
    document.body.removeChild(wrap);
    return canvas;
  }

  async function generatePlanPDF(){
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const PW = pdf.internal.pageSize.getWidth();
    const PH = pdf.internal.pageSize.getHeight();
    const margin = 14;
    const contentW = PW - margin * 2;

    function placeCanvas(canvas, pdf, startPage){
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      const imgH = (canvas.height / canvas.width) * contentW;
      const usable = PH - margin * 2;
      let yOff = 0;
      let first = true;
      while (yOff < imgH) {
        if (!first) pdf.addPage();
        first = false;
        pdf.addImage(imgData, 'JPEG', margin, margin - yOff, contentW, imgH);
        yOff += usable;
      }
    }

    const headerHTML =
      '<div style="border-bottom:3px solid #1B2A4A;padding-bottom:16px;margin-bottom:24px;">' +
        '<div style="font-size:11px;font-weight:700;letter-spacing:.12em;color:#C0392B;text-transform:uppercase;margin-bottom:6px;">Wildewood Education</div>' +
        '<div style="font-size:26px;font-weight:800;color:#1B2A4A;letter-spacing:-.01em;">Recommended Session Plan</div>' +
        '<div style="font-size:16px;font-weight:600;color:#1B2A4A;margin-top:4px;">' + name + '</div>' +
      '</div>';

    const page1Canvas = await renderSection(headerHTML + infoBlockHTML, '#FCFBF8');
    placeCanvas(page1Canvas, pdf);

    pdf.addPage();
    const page2Header =
      '<div style="border-bottom:2px solid #1B2A4A;padding-bottom:12px;margin-bottom:20px;">' +
        '<div style="font-size:11px;font-weight:700;letter-spacing:.12em;color:#C0392B;text-transform:uppercase;margin-bottom:4px;">Wildewood Education</div>' +
        '<div style="font-size:20px;font-weight:800;color:#1B2A4A;">Recommended Session Timeline \u2014 ' + name + '</div>' +
      '</div>';
    const page2Canvas = await renderSection(page2Header + sessionListHTML, '#FCFBF8');
    placeCanvas(page2Canvas, pdf);

    return pdf;
  }

  async function downloadPlanPDF(btnId){
    const btn = btnId ? document.getElementById(btnId) : null;
    const orig = btn ? btn.textContent : '';
    if (btn){ btn.disabled = true; btn.textContent = 'Generating\u2026'; }
    try {
      const pdf = await generatePlanPDF();
      pdf.save('Session_Plan_' + (name || 'Student').replace(/\s+/g, '_') + '.pdf');
    } catch(e){ alert('Could not generate PDF: ' + e.message); }
    if (btn){ btn.disabled = false; btn.textContent = orig; }
  }

  document.getElementById('downloadPdfBtn').onclick = () => downloadPlanPDF('downloadPdfBtn');

  document.getElementById('retakeBtn').onclick = () => {
    state = {
      phase:'intro', fixedStep:0, sessionStep:0, sessionSubStep:0, history:[], future:[],
      answers:{ name:'',sessioncount:null,testdate:'',startdate:'',testtype:null,subjects:[],priorstudy:null,practicetestplan:null,sessions:[],sessionconsistency:null,scheduleahead:null,availabledays:[],timewindows:[],unavailable:'',schedulelimit:null,meetingfrequency:null,scheduleextra:'' }
    };
    render();
  };

  document.getElementById('sendBtn').onclick = async () => {
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const pdf = await generatePlanPDF();
      const pdfBase64 = pdf.output('datauristring').split(',')[1];

      const payload = {
        name: state.answers.name,
        pdfBase64: pdfBase64,
        summary: 'Please see the attached PDF for the full session plan.',
      };

      const resp = await fetch('https://wildewood-scheduler.vercel.app/api/send-plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (resp.ok){
        renderSent(s, name, downloadPlanPDF, true);
      } else {
        renderSent(s, name, downloadPlanPDF, false);
      }
    } catch(err) {
      renderSent(s, name, downloadPlanPDF, false);
    }
  };
}

function renderSent(s, name, downloadPlanPDF, success){
  s.innerHTML = '';
  if (success){
    s.innerHTML = `
      <div class="result-eyebrow">All Set</div>
      <div class="result-title sent-screen">Plan sent to your scheduler</div>
      <div class="result-sub sent-screen">The PDF has been sent directly to shaina@wildewoodeducation.com. You can also save a copy below.</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
        <button class="btn btn-primary" id="downloadBtn" style="background:var(--navy-soft);">⬇ Save as PDF</button>
      </div>
      <div><button class="btn btn-ghost" id="restartBtn">Start a new quiz</button></div>
    `;
  } else {
    s.innerHTML = `
      <div class="result-eyebrow">Couldn't send automatically</div>
      <div class="result-title sent-screen">Something went wrong</div>
      <div class="result-sub sent-screen">The plan didn't send automatically. Download the PDF below and send it to shaina@wildewoodeducation.com directly.</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
        <button class="btn btn-primary" id="downloadBtn">⬇ Save as PDF</button>
      </div>
      <div><button class="btn btn-ghost" id="restartBtn">Start a new quiz</button></div>
    `;
  }
  document.getElementById('downloadBtn').onclick = () => downloadPlanPDF('downloadBtn');
  document.getElementById('restartBtn').onclick = () => {
    state = {
      phase:'intro', fixedStep:0, sessionStep:0, sessionSubStep:0, history:[], future:[],
      answers:{ name:'',sessioncount:null,testdate:'',startdate:'',testtype:null,subjects:[],priorstudy:null,practicetestplan:null,sessions:[],sessionconsistency:null,scheduleahead:null,availabledays:[],timewindows:[],unavailable:'',schedulelimit:null,meetingfrequency:null,scheduleextra:'' }
    };
    render();
  };
}

function buildSummaryText(sessionWeeks, ptWeek){
  const a = state.answers;
  const lines = [
    `Student: ${a.name}`,
    `Test date: ${a.testdate}`,
    `Start date: ${a.startdate}`,
    `Sessions: ${a.sessioncount}`,
    `Subjects: ${(a.subjects||[]).map(s => SUBJECT_LABELS[s] || s).join(', ')}`,
    `Prior study: ${{none:"Haven't started yet", some:'A little bit', lots:'A good amount'}[a.priorstudy] || a.priorstudy}`,
    `Practice test: ${{yes:'Yes', no:'No'}[a.practicetestplan] || a.practicetestplan}`,
    '',
    'Scheduling & Availability:',
    `Session consistency: ${{very:'Very important — consistent recurring slot', somewhat:'Somewhat — try to keep consistent but can flex', flexible:'Not important — schedule session by session'}[a.sessionconsistency] || a.sessionconsistency || 'N/A'}`,
    `Schedule visibility: ${{day:'Just a day or two', week:'About a week out', month:'A few weeks to a month', open:'Fairly open and predictable'}[a.scheduleahead] || a.scheduleahead || 'N/A'}`,
    `Available days: ${(a.availabledays||[]).map(d=>({mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'}[d]||d)).join(', ') || 'N/A'}`,
    `Preferred times: ${(a.timewindows||[]).map(t=>({'8to10':'8–10 am','10tonoon':'10 am – Noon','12to3':'12–3 pm','3to5':'3–5 pm','5to7':'5–7 pm','after7':'After 7 pm'}[t]||t)).join(', ') || 'N/A'}`,
    `Never available: ${a.unavailable || 'None noted'}`,
    `Schedule confirmed through: ${{yes:'Only through a certain date', no:'Fairly open'}[a.schedulelimit] || a.schedulelimit || 'N/A'}`,
    `Meeting frequency: ${{  '1x':'1x per week','2x':'2x per week','intensive':'Intensive (3+ times per week)','notsure':'Not sure yet'}[a.meetingfrequency] || a.meetingfrequency || 'N/A'}`,
    `Additional notes: ${a.scheduleextra || 'None'}`,
    '',
    'Session Plan:',
  ];
  a.sessions.forEach((sess, i) => {
    if (sess.type === 'afterpt' && ptWeek){
      lines.push(`  → Suggested practice test: ${ptWeek}`);
    }
    const rawSessGoals = (sess.goals||[]).filter(function(g){ return g !== '__notsure__'; });
    const goals = sess.type === 'afterpt'
      ? ['Practice test results review', ...rawSessGoals]
      : rawSessGoals.length === 0 && (sess.goals||[]).includes('__notsure__')
        ? ['TBD — student indicated they are not sure yet']
        : rawSessGoals;
    lines.push(`Session ${i+1} (${sessionWeeks[i]}): ${SESSION_TYPES[sess.type]?.label}`);
    if (goals.length) lines.push(`  Goals: ${goals.join(', ')}`);
  });
  return lines.join('\n');
}
